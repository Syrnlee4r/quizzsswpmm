<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSW 食品製造業 練習問題</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#18203a;--mut:#6b7491;--bd:#e0e5f2;--ok:#16a05a;--okb:#e2f6ea;--ng:#d6453a;--ngb:#fdeae8;--ac:#4b5fe8;--ac2:#8b5cf6;--sh:0 6px 20px rgba(40,50,100,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--tx:#e9ecf8;--mut:#9aa3c4;--bd:#2a3050;--ok:#4cd68a;--okb:#14301f;--ng:#ff8b80;--ngb:#3a1b1a;--ac:#7c8cff;--ac2:#a78bfa;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--tx:#e9ecf8;--mut:#9aa3c4;--bd:#2a3050;--ok:#4cd68a;--okb:#14301f;--ng:#ff8b80;--ngb:#3a1b1a;--ac:#7c8cff;--ac2:#a78bfa;--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.65}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:22px;padding:28px 22px;box-shadow:var(--sh);margin-bottom:22px}
.hero small{opacity:.85;letter-spacing:.08em}
.hero h1{margin:6px 0 6px;font-size:1.55rem;line-height:1.3}
.hero p{margin:0;opacity:.9;font-size:.92rem}
h3{font-size:.85rem;color:var(--mut);margin:22px 4px 8px;letter-spacing:.06em}
.grid{display:grid;gap:10px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;text-align:left;box-shadow:var(--sh);width:100%;transition:.15s}
.card b{display:block;font-size:1.02rem}
.card span{color:var(--mut);font-size:.85rem}
.card.on{border-color:var(--ac);background:linear-gradient(0deg,var(--card),var(--card)) padding-box}
.card.on b::after{content:" ✓";color:var(--ac)}
.card.soon{border-style:dashed;box-shadow:none;color:var(--mut);cursor:default;text-align:center}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .card{text-align:center}
.modes .ic{font-size:1.6rem;display:block}
.go{width:100%;margin-top:22px;border:0;border-radius:16px;padding:16px;font-size:1.1rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh)}
.go:active{transform:scale(.98)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px}
.top .in{max-width:720px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip.warn{color:var(--ng);border-color:var(--ng)}
.fin{background:none;border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--mut)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-top:6px}
.q .no{color:var(--ac);font-weight:700;font-size:.85rem}
.q h2{font-size:1.05rem;margin:6px 0 14px;font-weight:600;white-space:pre-line}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;transition:.15s}
.o i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:1.5px solid var(--bd);display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:700}
.o:hover:not(:disabled){border-color:var(--ac)}
.o:disabled{cursor:default}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.ok i{background:var(--ok);color:#fff;border-color:var(--ok)}
.o.ng{background:var(--ngb);border-color:var(--ng)}.o.ng i{background:var(--ng);color:#fff;border-color:var(--ng)}
.fb{margin-top:12px;font-weight:700}.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;padding:13px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);font-weight:600}
.nav button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.nav button:disabled{opacity:.4}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:16px}
.map button{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);font-size:.8rem;font-weight:600}
.map .cur{outline:2.5px solid var(--ac)}
.map .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.map .ng{background:var(--ng);color:#fff;border-color:var(--ng)}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0)}
.ring div{width:134px;height:134px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;font-weight:800;line-height:1.1;text-align:center}
.ring small{display:block;font-size:.8rem;color:var(--mut);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;font-size:.78rem;color:var(--mut)}
.stats b{display:block;font-size:1.2rem;color:var(--tx)}
.rv{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ng);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.9rem;white-space:pre-line}
.rv em{display:block;font-style:normal;margin-top:6px;color:var(--ok);font-weight:600}
.rv u{display:block;text-decoration:none;color:var(--ng);margin-top:4px}
ruby{ruby-position:over}rt{font-size:.52em;font-weight:400;color:var(--mut);letter-spacing:0}.o span,.q h2,.rv{line-height:2}.nofuri rt{display:none}.nofuri .o span,.nofuri .q h2,.nofuri .rv{line-height:1.65}.tg{display:inline-block;margin-top:18px;background:var(--card);border:1.5px solid var(--bd);border-radius:999px;padding:6px 16px;font-size:.88rem}</style>
</head>
<body>

<section id="home" class="wrap">
  <div class="hero"><small>特定技能評価試験</small><h1>食品製造業<br>練習問題</h1><p>ตอบแล้วเฉลยทันที · Jawab langsung lihat jawaban benar</p></div>
  <h3>問題セット (SET SOAL)</h3>
  <div class="grid" id="sets"></div>
  <h3>モード (MODE)</h3>
  <div class="modes">
    <button class="card on" id="m-timed"><span class="ic">⏱</span><b>タイマーあり</b><span>60分 · batas waktu</span></button>
    <button class="card" id="m-free"><span class="ic">♾</span><b>時間なし</b><span>tanpa batas waktu</span></button>
  </div>
  <button class="tg" id="tg">ふりがな: ON</button>
  <button class="go" id="go">スタート ▶</button>
</section>

<section id="quiz" hidden>
  <div class="top"><div class="in">
    <div class="row"><span class="chip" id="tm">⏱ 60:00</span><span class="chip" id="sc">正解 0</span><button class="fin" id="fin">終了</button></div>
    <div class="prog"><i id="pg"></i></div>
  </div></div>
  <div class="wrap" style="padding-top:8px">
    <div class="q"><div class="no" id="no"></div><h2 id="qt"></h2><div id="opts"></div><div class="fb" id="fb"></div></div>
    <div class="nav"><button id="prev">◀ 前へ</button><button id="next" class="p">次へ ▶</button></div>
    <div class="map" id="map"></div>
  </div>
</section>

<section id="result" class="wrap" hidden>
  <div class="hero" style="text-align:center"><small id="rt"></small><div class="ring" id="ring"><div id="rs"></div></div><p id="rm"></p></div>
  <div class="stats" id="stats"></div>
  <h3>間違えた問題 / 未回答 (SOAL SALAH / KOSONG)</h3>
  <div id="rev"></div>
  <button class="go" id="again">もう一度 ↻</button>
  <button class="go" id="back" style="background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:none;margin-top:10px">ホームへ</button>
</section>

<script>

const MAP={};FR.forEach(e=>{MAP[e.replace(/\[[^\]]*\]/g,"")]=e.replace(/([0-9\u4e00-\u9fff々]+)\[([^\]]+)\]/g,"<ruby>$1<rt>$2</rt></ruby>")});
const MAXL=Math.max(...Object.keys(MAP).map(k=>k.length));
function rb(t){let o="",i=0;while(i<t.length){let m=0;for(let l=Math.min(MAXL,t.length-i);l>0;l--){const k=t.substr(i,l);if(MAP[k]){o+=MAP[k];i+=l;m=1;break}}if(!m){const c=t[i++];o+=c==="<"?"&lt;":c===">"?"&gt;":c==="&"?"&amp;":c==="\n"?"<br>":c}}return o}
function H(el,t){el.innerHTML=rb(t)}
function rubyNodes(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode()){const n=w.currentNode;if(/[\u4e00-\u9fff]/.test(n.nodeValue)&&!/^(SCRIPT|STYLE|RT|RUBY)$/.test(n.parentNode.nodeName))a.push(n)}
a.forEach(n=>{const s=document.createElement("span");s.innerHTML=rb(n.nodeValue.replace(/\n\s*/g,""));n.replaceWith(...s.childNodes)})}
const L=["A","B","C"];
const $=s=>document.querySelector(s);
let sel=0,timed=true,S,cur,ans,t0,tEnd,tm,fcf;

function show(v){["home","quiz","result"].forEach(x=>$("#"+x).hidden=x!==v);scrollTo(0,0)}
function drawSets(){
  const g=$("#sets");g.innerHTML="";
  SETS.forEach((s,i)=>{const b=document.createElement("button");b.className="card"+(i===sel?" on":"");
    b.innerHTML="<b></b><span></span>";H(b.children[0],s.title);H(b.children[1],s.sub+" · "+s.time+"分");
    b.onclick=()=>{sel=i;drawSets()};g.appendChild(b)});
  const d=document.createElement("div");d.className="card soon";H(d,"＋ 新しい問題セット、準備中…");g.appendChild(d);
}
function setMode(t){timed=t;$("#m-timed").classList.toggle("on",t);$("#m-free").classList.toggle("on",!t)}
$("#m-timed").onclick=()=>setMode(true);$("#m-free").onclick=()=>setMode(false);

function start(){
  S=SETS[sel];ans=Array(S.q.length).fill(-1);cur=0;t0=Date.now();tEnd=t0+S.time*60000;
  $("#tm").hidden=!timed;clearInterval(tm);tm=setInterval(tick,500);tick();render();show("quiz");
}
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function tick(){
  const c=$("#tm");
  if(timed){const r=tEnd-Date.now();c.textContent="⏱ "+mmss(r);c.classList.toggle("warn",r<300000);if(r<=0)finish()}
  else c.textContent="⏱ "+mmss(Date.now()-t0);
}
function render(){
  const d=S.q[cur],a=ans[cur],n=S.q.length;
  H($("#no"),"問 "+(cur+1)+" / "+n);
  H($("#qt"),d[0].replace(/^問\d+\s*/,""));
  const o=$("#opts");o.innerHTML="";
  for(let k=0;k<3;k++){
    const b=document.createElement("button");b.className="o";b.innerHTML="<i>"+L[k]+"</i><span></span>";
    H(b.children[1],d[k+1]);b.disabled=a>=0;
    if(a>=0){if(k===d[4])b.classList.add("ok");else if(k===a)b.classList.add("ng")}
    b.onclick=()=>{ans[cur]=k;render()};o.appendChild(b);
  }
  const f=$("#fb");
  if(a<0){f.className="fb";f.textContent=""}
  else if(a===d[4]){f.className="fb ok";H(f,"⭕ 正解です！")}
  else{f.className="fb ng";H(f,"❌ 不正解　正解は "+L[d[4]]+" です。")}
  $("#prev").disabled=cur===0;
  const last=cur===n-1;H($("#next"),last?"結果を見る ▶":"次へ ▶");$("#next").onclick=last?finish:()=>{cur++;render()};
  $("#prev").onclick=()=>{cur--;render()};
  const m=$("#map");m.innerHTML="";
  S.q.forEach((q,i)=>{const b=document.createElement("button");b.textContent=i+1;
    if(ans[i]>=0)b.classList.add(ans[i]===q[4]?"ok":"ng");if(i===cur)b.classList.add("cur");
    b.onclick=()=>{cur=i;render()};m.appendChild(b)});
  const ok=ans.filter((x,i)=>x===S.q[i][4]).length,done=ans.filter(x=>x>=0).length;
  H($("#sc"),"正解 "+ok+" / "+done);$("#pg").style.width=(done/n*100)+"%";
}
$("#fin").onclick=()=>{
  const b=$("#fin");
  if(fcf){clearTimeout(fcf);fcf=0;finish();return}
  H(b,"本当に終了？");fcf=setTimeout(()=>{fcf=0;H(b,"終了")},3000);
};
function finish(){
  clearInterval(tm);clearTimeout(fcf);fcf=0;H($("#fin"),"終了");
  const n=S.q.length,ok=ans.filter((x,i)=>x===S.q[i][4]).length,none=ans.filter(x=>x<0).length,ng=n-ok-none,pct=Math.round(ok/n*100);
  H($("#rt"),S.title);$("#ring").style.setProperty("--p",pct);
  $("#rs").innerHTML=ok+" / "+n+"<small>"+pct+"%</small>";
  H($("#rm"),pct>=80?"すばらしい！ Sangat bagus 🎉":pct>=60?"もう少し！ Sedikit lagi 💪":"がんばろう！ Ayo belajar lagi 📚");
  const el=Math.min(Date.now(),tEnd)-t0;
  $("#stats").innerHTML="<div><b>"+ok+"</b>"+rb("正解")+"</div><div><b>"+ng+"</b>"+rb("不正解")+"</div><div><b>"+none+"</b>"+rb("未回答")+"</div><div><b>"+mmss(el)+"</b>"+rb("時間")+"</div>";
  const r=$("#rev");r.innerHTML="";
  S.q.forEach((q,i)=>{if(ans[i]===q[4])return;
    const d=document.createElement("div");d.className="rv";H(d,q[0]);
    const e=document.createElement("em");H(e,"✔ "+L[q[4]]+"　"+q[q[4]+1]);d.appendChild(e);
    if(ans[i]>=0){const u=document.createElement("u");H(u,"✖ あなたの答え: "+L[ans[i]]+"　"+q[ans[i]+1]);d.appendChild(u)}
    else{const u=document.createElement("u");H(u,"未回答");d.appendChild(u)}
    r.appendChild(d)});
  if(!r.children.length)r.innerHTML="<div class='rv' style='border-left-color:var(--ok)'>"+rb("全問正解！")+" Semua benar 🎉</div>";
  show("result");
}
$("#go").onclick=start;$("#again").onclick=start;$("#back").onclick=()=>show("home");
$("#tg").onclick=()=>{const o=document.body.classList.toggle("nofuri");$("#tg").textContent="ふりがな: "+(o?"OFF":"ON")};
drawSets();rubyNodes(document.body);
